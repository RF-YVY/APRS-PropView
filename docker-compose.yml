services:
  aprs-propview:
    image: ghcr.io/rf-yvy/aprs-propview:latest
    container_name: aprs-propview
    restart: unless-stopped
    ports:
      - "14501:14501"
    environment:
      PROPVIEW_DATA_DIR: /data
      PROPVIEW_HOST: 0.0.0.0
      PROPVIEW_PORT: 14501
      PROPVIEW_LAUNCH_BROWSER: ""
    volumes:
      - ./data:/data
    # For USB serial TNCs, uncomment and adjust the device path.
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0

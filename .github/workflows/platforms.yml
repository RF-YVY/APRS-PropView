name: Platform compatibility
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/rebuild-macos-arm.yml'
  pull_request:
    paths-ignore:
      - '.github/workflows/rebuild-macos-arm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm, macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libportaudio2
      - run: python -m pip install -r requirements.txt pytest
      - run: python native/build_modem.py
      - run: python -m pytest -q
      - run: node --test tests/test_modem_setup_guidance.cjs tests/test_release_ui.cjs
      - run: python main.py --modem-self-test
      - run: python scripts/platform_smoke.py
      - name: Measure receiver processing cost
        run: python scripts/benchmark_modem.py --seconds 5
      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: |
          python -m pip install pyinstaller
          python build_linux.py
          dist/APRSPropView --modem-self-test
          python scripts/platform_smoke.py --executable dist/APRSPropView
      - name: Build macOS application
        if: runner.os == 'macOS'
        run: |
          python -m pip install pyinstaller pystray
          python build_macos.py
          "dist/APRS PropView.app/Contents/MacOS/APRS PropView" --modem-self-test
      - name: Archive native release artifact
        if: runner.os != 'Windows'
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: native-${{ matrix.os }}
          path: dist/APRSPropView-*.tar.gz
          if-no-files-found: error
